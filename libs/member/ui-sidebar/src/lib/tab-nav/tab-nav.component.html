
<nav class="no-scrollbar flex h-14 items-center gap-1 overflow-x-auto border-b border-gray-200 bg-white px-2 md:gap-0.5 md:px-4">
  @for (tab of tabs; track tab.path) {
    <a
      [routerLink]="tab.path"
      class="relative flex shrink-0 items-center justify-center rounded-xl text-sm font-medium transition-all duration-200 ease-out md:rounded-[10px] md:px-4 md:py-3"
      [class]="activeTab() === tab.path
        ? 'bg-amber-500 text-white md:bg-amber-50 md:text-amber-600'
        : 'text-gray-500 md:text-gray-600 md:hover:bg-amber-50 md:hover:text-amber-600'">
      <div class="flex h-12 w-12 items-center justify-center md:h-auto md:w-auto md:gap-2">
        <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="tab.icon" />
        </svg>
        <span class="hidden whitespace-nowrap md:inline">{{ tab.label }}</span>
      </div>
      @if (activeTab() === tab.path) {
        <div class="absolute bottom-0 left-2 right-2 hidden h-0.5 rounded-full bg-amber-500 md:block"></div>
      }
    </a>
  }
</nav>
