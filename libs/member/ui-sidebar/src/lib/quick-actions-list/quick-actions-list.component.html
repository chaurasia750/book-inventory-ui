<div class="border-t border-gray-100 px-4 pt-3 pb-2">
  <h3 class="text-[9px] font-semibold uppercase tracking-widest text-gray-400">Quick Actions</h3>
</div>
<div class="grid grid-cols-2 gap-2 px-3 pb-2">
  @for (action of actions; track action.key) {
    <button
      (click)="onAction(action)"
      class="flex flex-col items-center gap-2 rounded-xl px-2 py-3 text-[10px] font-semibold transition-all duration-200 border bg-white"
      [class]="activeItem() === action.key
        ? 'border-saffron-200 bg-saffron-50 text-saffron-700 shadow-sm'
        : 'border-gray-100/80 text-gray-600 hover:border-saffron-200 hover:bg-saffron-50 hover:text-saffron-700 hover:shadow-sm active:scale-95'">
      <div class="flex h-8 w-8 items-center justify-center rounded-xl"
        [class]="activeItem() === action.key ? 'bg-saffron-200/60 text-saffron-600' : 'bg-gray-100 text-gray-500'">
        <svg class="h-4 w-4"
          fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="action.icon" />
        </svg>
      </div>
      <span class="text-center leading-tight">{{ action.label }}</span>
    </button>
  }
</div>

<div class="mx-4 border-t border-gray-100"></div>

<div class="px-3 py-2">
  <button
    (click)="onLogout()"
    class="flex w-full items-center justify-center gap-2 rounded-xl px-3 py-2.5 text-[11px] font-semibold text-red-500 transition-all duration-200 border border-red-100 bg-white hover:bg-red-50 hover:text-red-600 hover:border-red-200 active:scale-95">
    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" />
    </svg>
    Logout
  </button>
</div>
