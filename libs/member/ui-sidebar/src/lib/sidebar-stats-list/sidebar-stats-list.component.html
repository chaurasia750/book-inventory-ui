<div class="rounded-xl border border-gray-200/60 bg-white p-4">
  <div class="space-y-0">
    @for (stat of statRows; track stat.key; let last = $last) {
      <div class="flex items-center justify-between py-2.5" [class.border-b]="!last" [class.border-gray-100]="!last">
        <div class="flex items-center gap-2.5">
          <span
            class="flex h-7 w-7 items-center justify-center rounded-lg text-[11px] font-bold"
            [class]="stat.bg + ' ' + stat.text">
            ₹
          </span>
          <span class="text-[13px] text-gray-500">{{ stat.label }}</span>
        </div>
        <span class="text-[13px] font-semibold text-gray-900">₹{{ getValue(stat.key).toLocaleString() }}</span>
      </div>
    }
  </div>
</div>
