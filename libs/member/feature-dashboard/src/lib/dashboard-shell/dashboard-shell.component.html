<div class="flex h-screen flex-col overflow-hidden bg-gray-50/30">
  <!-- Custom header for member dashboard -->
  <header class="sticky top-0 z-[1000] flex w-full bg-header backdrop-blur-header border-default xl:border-b shadow-sm">
    <div class="flex h-[60px] w-full">
      <!-- Header left: matches profile sidebar width, small logo + hamburger when collapsed -->
      <div
        class="flex items-center gap-2 border-r border-default shrink-0 overflow-hidden transition-all duration-300 ease-in-out px-3"
        [style.width]="(sidebarExpanded | async) ? '320px' : '80px'"
        [style.min-width]="(sidebarExpanded | async) ? '320px' : '80px'">
        <a routerLink="/" class="flex items-center shrink-0">
          <img src="assets/logo.jpeg" alt="Book Inventory" class="rounded shrink-0"
            [class.h-9]="(sidebarExpanded | async)"
            [class.h-6]="!(sidebarExpanded | async)"
            [style.width]="(sidebarExpanded | async) ? 'auto' : '24px'" />
        </a>
        <button
          class="flex items-center justify-center w-10 h-10 text-secondary-fg border-default rounded-xl hover:bg-surface-hover transition-colors duration-200 shrink-0"
          [style.margin-left]="((sidebarExpanded | async) || (sidebarOpen | async)) ? 'auto' : '0'"
          (click)="toggleSidebar()" aria-label="Toggle Sidebar">
          <svg width="18" height="14" viewBox="0 0 16 12" fill="none">
            <path fill-rule="evenodd" clip-rule="evenodd"
              d="M0.583252 1C0.583252 0.585788 0.919038 0.25 1.33325 0.25H14.6666C15.0808 0.25 15.4166 0.585786 15.4166 1C15.4166 1.41421 15.0808 1.75 14.6666 1.75L1.33325 1.75C0.919038 1.75 0.583252 1.41422 0.583252 1ZM0.583252 11C0.583252 10.5858 0.919038 10.25 1.33325 10.25L14.6666 10.25C15.0808 10.25 15.4166 10.5858 15.4166 11C15.4166 11.4142 15.0808 11.75 14.6666 11.75L1.33325 11.75C0.919038 11.75 0.583252 11.4142 0.583252 11ZM1.33325 5.25C0.919038 5.25 0.583252 5.58579 0.583252 6C0.583252 6.41421 0.919038 6.75 1.33325 6.75L7.99992 6.75C8.41413 6.75 8.74992 6.41421 8.74992 6C8.74992 5.58579 8.41413 5.25 7.99992 5.25L1.33325 5.25Z"
              fill="currentColor" />
          </svg>
        </button>
      </div>
      <!-- Header right: breadcrumb + actions -->
      <div class="flex items-center justify-between flex-1 min-w-0 px-4">
        <div class="hidden items-center gap-1.5 sm:flex">
          <svg class="h-3 w-3 text-muted-fg shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
          </svg>
          <span class="text-[12px] font-medium text-secondary-fg truncate">{{ breadcrumb() }}</span>
        </div>
        <div class="flex items-center gap-1 sm:gap-1.5">
          <app-theme-toggle />
          <app-notification-dropdown />
          <app-user-dropdown
            [userName]="userName"
            [userRole]="userRole"
            [userLoginId]="userLoginId"
            [email]="userEmail"
            [profileImageUrl]="profileImageUrl"
            changePasswordRoute="/settings/change-password"
            (signOut)="logout()"
          />
        </div>
      </div>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden">
    <!-- Backdrop (mobile only) -->
    @if (sidebarOpen | async) {
      <div
        class="fixed inset-0 z-[999] bg-gray-900/50 transition-opacity lg:hidden"
        (click)="closeSidebar()">
      </div>
    }

    <!-- Profile Sidebar: same width as header-left, collapsible on desktop -->
    <aside
      class="flex flex-col bg-white shadow-sm transition-all duration-300 ease-in-out
             fixed top-[60px] left-0 z-[1000] h-[calc(100vh-60px)]
             xl:relative xl:top-auto xl:z-auto xl:h-auto"
      [class.w-[320px]]="(sidebarExpanded | async) || (sidebarOpen | async)"
      [class.w-0]="!((sidebarExpanded | async) || (sidebarOpen | async))"
      [class.translate-x-0]="sidebarOpen | async"
      [class.-translate-x-full]="!(sidebarOpen | async)"
      [class.xl:translate-x-0]="true"
      [class.overflow-hidden]="!((sidebarExpanded | async) || (sidebarOpen | async))">
      <div class="thin-scrollbar flex flex-1 flex-col overflow-y-auto min-w-[320px]">
        <app-sidebar-profile-card />
        <app-quick-actions-list (actionCompleted)="closeSidebar()" />
      </div>
    </aside>

    <main class="flex flex-1 flex-col overflow-hidden min-w-0">
      <app-tab-nav />
      <div class="flex-1 overflow-y-auto p-3 sm:p-4 lg:p-5">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
