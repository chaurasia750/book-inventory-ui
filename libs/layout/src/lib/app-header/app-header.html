<header class="sticky top-0 z-[1000] flex h-14 w-full items-center gap-3 border-b border-neutral-200 bg-white px-3 xl:px-5 dark:border-charcoal-700 dark:bg-charcoal-800">
  <button
    class="relative inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-[9px] border border-neutral-200 bg-white text-charcoal-600 transition-colors hover:bg-neutral-50 dark:border-charcoal-700 dark:bg-charcoal-800 dark:text-gray-200"
    [class.bg-gold-50]="isMobileOpen$ | async"
    (click)="handleToggle()" aria-label="Toggle Sidebar">
    @if (isMobileOpen$ | async) {
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
    } @else {
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h16" /></svg>
    }
  </button>

  <span class="h-[22px] w-px shrink-0 bg-neutral-200 dark:bg-charcoal-700"></span>
  <span class="min-w-0 truncate text-[13.5px] font-semibold text-charcoal-900 dark:text-gray-100">{{ title() }}</span>
  <span class="flex-1"></span>

  <ng-content />
  <app-theme-toggle />
  <span class="hidden h-[22px] w-px shrink-0 bg-neutral-200 sm:block dark:bg-charcoal-700"></span>
  <app-user-dropdown
    [userName]="userName"
    [userRole]="userRole"
    [userLoginId]="userLoginId"
    [email]="userEmail"
    changePasswordRoute="/change-password"
    (signOut)="logout()"
  />
</header>
