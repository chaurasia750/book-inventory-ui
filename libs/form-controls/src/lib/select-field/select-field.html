<div class="app-field">
  @if (label()) {
    <label class="app-field-label" [for]="fieldId">{{ label() }}</label>
  }
  <select [id]="fieldId" class="app-field-select" [formControl]="control()">
    @for (option of options(); track option.value) {
      <option [value]="option.value">{{ option.label }}</option>
    }
  </select>
  <app-form-error [control]="control()" />
</div>
