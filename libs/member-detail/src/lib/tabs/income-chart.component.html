<div class="rounded-2xl border border-gray-100 bg-white p-5 shadow-sm">
  <div class="flex items-center justify-between mb-5">
    <h3 class="text-sm font-semibold text-gray-900">Level-wise Income</h3>
  </div>
  @if (data.length) {
    <div class="space-y-5">
      @for (item of data; track item.level) {
        <div>
          <div class="flex items-center gap-4 mb-1.5">
            <span class="w-16 shrink-0 text-xs font-medium text-gray-500">Level {{ item.level }}</span>
            <div class="flex-1"></div>
            <span class="shrink-0 text-xs text-gray-400">{{ item.memberCount }} members</span>
            <span class="w-24 shrink-0 text-right text-sm font-semibold text-gray-900">{{ item.income | currency:'INR':'symbol':'1.0-0' }}</span>
          </div>
          <div class="h-2.5 w-full overflow-hidden rounded-full bg-gray-100">
            <div
              class="h-full rounded-full bg-gradient-to-r from-amber-500 to-orange-500 transition-all duration-700 ease-out"
              [style.width.%]="getBarWidth(item.income)">
            </div>
          </div>
        </div>
      }
    </div>
  } @else {
    <div class="flex items-center justify-center py-8 text-sm text-gray-400">
      No income data available
    </div>
  }
</div>
