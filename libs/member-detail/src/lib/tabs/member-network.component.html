@if (summaryLoading()) {
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
    @for (i of [1,2,3]; track i) {
      <div class="rounded-2xl border border-gray-100 bg-white p-5 shadow-sm animate-pulse">
        <div class="flex items-center gap-3">
          <div class="h-10 w-10 rounded-xl bg-gray-200"></div>
          <div class="flex-1">
            <div class="h-3 w-20 bg-gray-200 rounded mb-2"></div>
            <div class="h-5 w-12 bg-gray-200 rounded"></div>
          </div>
        </div>
      </div>
    }
  </div>
} @else if (summary(); as s) {
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
    <button
      (click)="selectTab('direct')"
      class="rounded-2xl border bg-white p-5 shadow-sm transition-all hover:shadow-md block text-left no-underline w-full"
      [class.border-[#66B42A]]="activeTab() === 'direct'"
      [class.ring-2]="activeTab() === 'direct'"
      [class.ring-[#66B42A]/20]="activeTab() === 'direct'">
      <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-saffron-50 text-saffron-600">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z"/></svg>
        </div>
        <div>
          <p class="text-xs font-medium text-gray-400">Direct Members</p>
          <p class="text-xl font-bold text-gray-900">{{ s.directReferrals }}</p>
        </div>
      </div>
    </button>

    <button
      (click)="selectTab('indirect')"
      class="rounded-2xl border bg-white p-5 shadow-sm transition-all hover:shadow-md block text-left no-underline w-full"
      [class.border-[#66B42A]]="activeTab() === 'indirect'"
      [class.ring-2]="activeTab() === 'indirect'"
      [class.ring-[#66B42A]/20]="activeTab() === 'indirect'">
      <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-orange-50 text-orange-600">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M18 18.72a9.094 9.094 0 003.741-.479 3 3 0 00-4.682-2.72m.94 3.198l.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0112 21c-2.17 0-4.207-.576-5.963-1.584A6.062 6.062 0 016 18.719m12 0a5.971 5.971 0 00-.941-3.197m0 0A5.995 5.995 0 0012 12.75a5.995 5.995 0 00-5.058 2.772m0 0a3 3 0 00-4.681 2.72 8.986 8.986 0 003.74.477m.94-3.197a5.971 5.971 0 00-.94 3.197M15 6.75a3 3 0 11-6 0 3 3 0 016 0zm6 3a2.25 2.25 0 11-4.5 0 2.625 2.625 0 010 5.25zm-13.5 0a2.25 2.25 0 114.5 0 2.25 2.25 0 01-4.5 0z"/></svg>
        </div>
        <div>
          <p class="text-xs font-medium text-gray-400">Indirect Members</p>
          <p class="text-xl font-bold text-gray-900">{{ s.indirectMembers }}</p>
        </div>
      </div>
    </button>

    <button
      (click)="selectTab('total')"
      class="rounded-2xl border bg-white p-5 shadow-sm transition-all hover:shadow-md block text-left no-underline w-full"
      [class.border-[#66B42A]]="activeTab() === 'total'"
      [class.ring-2]="activeTab() === 'total'"
      [class.ring-[#66B42A]/20]="activeTab() === 'total'">
      <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-green-50 text-green-600">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 15.75a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25h-2.25a2.25 2.25 0 01-2.25-2.25v-2.25z"/></svg>
        </div>
        <div>
          <p class="text-xs font-medium text-gray-400">Total Team</p>
          <p class="text-xl font-bold text-gray-900">{{ s.totalTeam }}</p>
        </div>
      </div>
    </button>
  </div>
}

<div class="mt-6 rounded-2xl border border-gray-100 bg-white shadow-sm">
  <!-- Tabs + Search -->
  <div class="flex flex-col gap-3 border-b border-gray-100 px-5 py-3 sm:flex-row sm:items-center">
    <!-- Tabs -->
    <div class="flex flex-1 gap-0 overflow-x-auto">
      @for (tab of tabs; track tab.path) {
        <button
          (click)="selectTab(tab.path)"
          class="px-4 py-2 text-sm font-medium whitespace-nowrap transition-all border-b-2 no-underline cursor-pointer"
          [class.border-[#66B42A]]="activeTab() === tab.path"
          [class.text-[#66B42A]]="activeTab() === tab.path"
          [class.border-transparent]="activeTab() !== tab.path"
          [class.text-gray-500]="activeTab() !== tab.path"
          [class.hover:text-gray-700]="activeTab() !== tab.path">
          {{ tab.label }}
          @if (summary(); as s) {
            <span class="ml-1.5 inline-flex h-5 min-w-[20px] items-center justify-center rounded-full px-1.5 text-[10px] font-bold"
              [class.bg-[#66B42A]/15]="activeTab() === tab.path"
              [class.text-[#66B42A]]="activeTab() === tab.path"
              [class.bg-gray-100]="activeTab() !== tab.path"
              [class.text-gray-500]="activeTab() !== tab.path">
              {{ tab.path === 'direct' ? s.directReferrals : tab.path === 'indirect' ? s.indirectMembers : s.totalTeam }}
            </span>
          }
        </button>
      }
    </div>

    <!-- Search -->
    <div class="relative">
      <svg class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        type="text"
        [ngModel]="searchInput()"
        (ngModelChange)="onSearch($event)"
        placeholder="Search by Name, Login ID or Reg No..."
        autocomplete="off"
        class="h-9 w-full rounded-lg border border-gray-200 bg-white pl-9 pr-8 text-sm text-gray-700 shadow-sm placeholder:text-gray-400 focus:border-[#66B42A] focus:outline-none focus:ring-2 focus:ring-[#66B42A]/20 sm:w-56 lg:w-72"
      />
      @if (searchInput()) {
        <button (mousedown)="$event.preventDefault(); clearSearch()"
          class="absolute right-2 top-1/2 flex h-5 w-5 -translate-y-1/2 items-center justify-center rounded-full text-gray-400 transition-colors hover:bg-gray-100 hover:text-gray-600">
          <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      }
    </div>
  </div>

  <div class="p-5">
    <!-- Direct Members Tab -->
    @if (activeTab() === 'direct') {
      <app-network-direct [memberId]="memberId()" />
    }

    <!-- Indirect Members Tab -->
    @if (activeTab() === 'indirect') {
      <app-network-indirect [memberId]="memberId()" />
    }

    <!-- Total Members Tab -->
    @if (activeTab() === 'total') {
      <app-network-total [memberId]="memberId()" [rootRegistrationNumber]="registrationNumber()" />
    }
  </div>
</div>
