<div class="rounded-2xl border border-gray-100 bg-white p-6 shadow-sm">
  <h3 class="text-sm font-semibold text-gray-900 mb-6">Member Journey Timeline</h3>
  <div class="relative">
    <!-- Vertical line -->
    <div class="absolute left-5 top-0 h-full w-px bg-gray-200"></div>
    <div class="space-y-6">
      @for (event of timeline; track event.id) {
        <div class="relative flex gap-4">
          <div class="relative z-10 flex h-10 w-10 shrink-0 items-center justify-center rounded-full shadow-sm" [class]="event.bgClass">
            <span [innerHTML]="event.icon" class="h-5 w-5" [class]="event.iconClass"></span>
          </div>
          <div class="flex-1 min-w-0 pt-1">
            <div class="flex items-center justify-between">
              <p class="text-sm font-semibold text-gray-900">{{ event.title }}</p>
              <span class="text-xs text-gray-400">{{ event.date }}</span>
            </div>
            @if (event.description) {
              <p class="mt-0.5 text-xs text-gray-500">{{ event.description }}</p>
            }
            @if (event.metadata) {
              <div class="mt-2 flex flex-wrap gap-2">
                @for (meta of event.metadata; track meta) {
                  <span class="inline-flex items-center rounded-lg bg-gray-50 px-2 py-0.5 text-xs font-medium text-gray-600 border border-gray-100">
                    {{ meta }}
                  </span>
                }
              </div>
            }
          </div>
        </div>
      }
    </div>
  </div>
</div>
