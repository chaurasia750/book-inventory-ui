@if (open()) {
  <div
    class="app-modal-backdrop"
    tabindex="0"
    role="button"
    aria-label="Close overlay"
    (click)="onBackdropClick()"
    (keydown.enter)="onBackdropClick()"
    (keydown.space)="onBackdropClick()"
  >
    <div
      class="app-modal"
      [class.app-modal--wide]="size() === 'wide'"
      role="dialog"
      aria-modal="true"
      (click)="onDialogClick($event)"
      (keydown)="onDialogClick($event)"
    >
      <div class="app-modal__header">
        @if (title()) {
          <h3 class="app-modal__title">{{ title() }}</h3>
        }
        <button type="button" class="app-modal__close" aria-label="Close" (click)="onCloseClick()">&times;</button>
      </div>

      <div class="app-modal__body">
        <ng-content />
      </div>

      <div class="app-modal__footer">
        <ng-content select="[footer]" />
      </div>
    </div>
  </div>
}
