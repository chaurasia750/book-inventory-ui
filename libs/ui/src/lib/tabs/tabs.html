<div class="app-tabs">
  <div class="app-tabs__header" role="tablist">
    @for (tab of tabs(); track tab.id; let i = $index) {
      <button
        type="button"
        role="tab"
        class="app-tabs__tab-btn"
        [class.active]="activeIndex() === i"
        [attr.aria-selected]="activeIndex() === i"
        (click)="selectTab(i)"
      >
        {{ tab.label() }}
      </button>
    }
  </div>

  <div class="app-tabs__body">
    <ng-content />
  </div>
</div>
