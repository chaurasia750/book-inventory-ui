<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Book Inventory</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- SEO Meta Tags -->
    <meta name="description" content="Book Inventory - property sales and agent management." />
    <meta name="author" content="Book Inventory" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->

    <!-- Twitter Card -->

    <!-- Canonical URL -->

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/assets/brand/logo.svg" />

    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons&display=swap" rel="stylesheet" />

    <!-- Schema.org Markup -->
  </head>
  <body>
    <app-root>
      <style>
        .splash-screen {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: #ffffff;
          font-family: system-ui, -apple-system, sans-serif;
        }
        .splash-logo {
          width: 100px;
          height: 100px;
          animation: splash-pulse 2s ease-in-out infinite;
        }
        .splash-logo svg, .splash-logo img { width: 100%; height: 100%; }
        .splash-logo img { object-fit: contain; }
        .splash-title {
          margin-top: 24px;
          font-size: 24px;
          font-weight: 700;
          letter-spacing: 2px;
          color: #074928;
        }
        .splash-subtitle {
          margin-top: 8px;
          font-size: 12px;
          letter-spacing: 4px;
          color: #66B42A;
          text-transform: uppercase;
        }
        .splash-loader {
          margin-top: 32px;
          display: flex;
          gap: 8px;
        }
        .splash-loader span {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: #66B42A;
          animation: splash-bounce 1.4s ease-in-out infinite both;
        }
        .splash-loader span:nth-child(1) { animation-delay: -0.32s; }
        .splash-loader span:nth-child(2) { animation-delay: -0.16s; }
        .splash-loader span:nth-child(3) { animation-delay: 0s; }
        @keyframes splash-pulse {
          0%, 100% { transform: scale(1); opacity: 1; }
          50% { transform: scale(1.05); opacity: 0.8; }
        }
        @keyframes splash-bounce {
          0%, 80%, 100% { transform: scale(0.6); }
          40% { transform: scale(1); }
        }
      </style>
      <div class="splash-screen">
        <div class="splash-logo">
          <img src="assets/brand/logo.svg" alt="Book Inventory logo" />
        </div>
        <div class="splash-title">Book Inventory</div>
        <div class="splash-loader">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </app-root>
  </body>
</html>
