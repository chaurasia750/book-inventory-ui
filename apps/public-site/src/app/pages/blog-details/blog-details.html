@if (post(); as p) {
  <article class="post">
    <a class="post__back" routerLink="/blog">&larr; Back to blog</a>
    <h1>{{ p.title }}</h1>
    <p class="post__meta">By {{ p.author }} · {{ p.publishedAt }}</p>
    <div class="post__tags">
      @for (tag of p.tags; track tag) {
        <span class="post__tag">{{ tag }}</span>
      }
    </div>
    <p class="post__excerpt">{{ p.excerpt }}</p>
    <p class="post__content">{{ p.content }}</p>
  </article>
} @else {
  <div class="post__not-found">
    <app-empty-state
      icon="🔍"
      title="Post not found"
      description="We couldn't find a blog post with that address. It may have been moved or removed."
    >
      <a routerLink="/blog" class="post__empty-link">Browse all posts</a>
    </app-empty-state>
  </div>
}
