<section class="features">
  <h1>Features</h1>
  <p class="intro">
    Everything you need to run your team's day-to-day, all in one connected platform.
  </p>
  <div class="features__grid">
    @for (feature of features; track feature.title) {
      <app-card [title]="feature.icon + ' ' + feature.title">
        <p>{{ feature.description }}</p>
      </app-card>
    }
  </div>
</section>
