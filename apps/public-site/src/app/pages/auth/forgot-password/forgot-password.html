<div class="forgot-password">
  <h1 class="forgot-password__title">{{ 'iam.forgot.title' | translate }}</h1>
  <p class="forgot-password__subtitle">{{ 'iam.forgot.subtitle' | translate }}</p>

  @if (submitted()) {
    <p class="forgot-password__success">{{ 'iam.forgot.success' | translate }}</p>
  } @else {
    <form class="forgot-password__form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <app-text-field
        [label]="'iam.forgot.emailLabel' | translate"
        type="email"
        [required]="true"
        [placeholder]="'iam.forgot.emailPlaceholder' | translate"
        [control]="form.controls.email"
      />

      @if (errorMessage()) {
        <p class="forgot-password__error">{{ errorMessage() }}</p>
      }

      <app-button type="submit" [loading]="submitting()" [disabled]="submitting()">{{ 'iam.forgot.submit' | translate }}</app-button>
    </form>
  }

  <a class="forgot-password__back" routerLink="/login">{{ 'iam.forgot.back' | translate }}</a>
</div>
