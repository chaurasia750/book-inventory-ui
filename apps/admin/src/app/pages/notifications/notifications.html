<div class="notifications">
  <div class="notifications__header">
    <h1 class="notifications__title">Notifications</h1>
    <app-button variant="secondary" (clicked)="markAllRead()">Mark all read</app-button>
  </div>

  <app-card>
    <ul class="notifications__list">
      @for (notification of notifications(); track notification.id) {
        <li class="notifications__item" [class.notifications__item--unread]="!notification.read">
          <span class="notifications__dot" [attr.data-type]="notification.type"></span>
          <div class="notifications__body">
            <p class="notifications__item-title">{{ notification.title }}</p>
            <p class="notifications__item-message">{{ notification.message }}</p>
            <span class="notifications__item-time">{{ notification.createdAt | date: 'medium' }}</span>
          </div>
        </li>
      } @empty {
        <li class="notifications__empty">You're all caught up.</li>
      }
    </ul>
  </app-card>
</div>
