@if (loading()) {
  <div class="flex items-center justify-center min-h-[60vh]">
    <div class="flex flex-col items-center gap-3">
      <svg class="h-8 w-8 animate-spin text-[#66B42A]" viewBox="0 0 24 24" fill="none">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
      </svg>
      <span class="text-sm text-gray-500">Loading...</span>
    </div>
  </div>
} @else if (member(); as m) {
  <div class="min-h-screen bg-[#F8F9FB]">
    <!-- Header -->
    <div class="border-b border-gray-100 bg-white px-6 py-3">
      <div class="mx-auto flex max-w-[1400px] items-center justify-between">
        <div class="flex items-center gap-2 text-sm text-gray-400">
          <a routerLink="/dashboard" class="hover:text-gray-600">Dashboard</a>
          <span>/</span>
          <a routerLink="/members/list" class="hover:text-gray-600">Members</a>
          <span>/</span>
          <span class="text-gray-800 font-medium">{{ profileFullName() }}</span>
        </div>
        <div class="flex items-center gap-2">
          <button class="rounded-lg border border-gray-200 bg-white px-3 py-1.5 text-xs font-medium text-gray-600 hover:bg-gray-50 transition-colors">Edit</button>
          <button class="rounded-lg border border-red-200 bg-white px-3 py-1.5 text-xs font-medium text-red-500 hover:bg-red-50 transition-colors">Delete</button>
          <a routerLink="/members/list" class="rounded-lg border border-gray-200 bg-white px-3 py-1.5 text-xs font-medium text-gray-600 hover:bg-gray-50 transition-colors no-underline">Back</a>
        </div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="border-b border-gray-100 bg-white px-6">
      <nav class="no-scrollbar mx-auto flex h-14 max-w-[1400px] items-center gap-1 overflow-x-auto px-2 md:gap-0.5 md:px-4">
        @for (tab of tabs; track tab.path) {
          <a [routerLink]="tab.path"
            class="relative flex shrink-0 cursor-pointer items-center justify-center rounded-xl text-sm font-medium no-underline transition-all duration-200 ease-out md:rounded-[10px] md:px-4 md:py-3"
            [class]="activeTab() === tab.path
              ? 'bg-[#66B42A] text-white md:bg-saffron-50 md:text-[#66B42A]'
              : 'text-gray-500 md:text-gray-600 md:hover:bg-saffron-50 md:hover:text-[#66B42A]'">
            <div class="flex h-12 w-12 items-center justify-center md:h-auto md:w-auto md:gap-2">
              <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="tab.icon" />
              </svg>
              <span class="hidden whitespace-nowrap md:inline">{{ tab.label }}</span>
            </div>
            @if (activeTab() === tab.path) {
              <div class="absolute bottom-0 left-2 right-2 hidden h-0.5 rounded-full bg-[#66B42A] md:block"></div>
            }
          </a>
        }
      </nav>
    </div>

    <!-- Content -->
    <div class="mx-auto max-w-[1400px] px-6 py-6">
      <div class="flex gap-6">
        <app-member-sidebar [profile]="profile()" />
        <main class="flex-1 min-w-0">
          <router-outlet />
        </main>
      </div>
    </div>
  </div>
}
