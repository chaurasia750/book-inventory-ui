<div class="rounded-xl border border-gray-200 bg-white p-5">
  <div class="flex flex-col gap-4 lg:flex-row lg:items-end">
    <div class="flex-1">
      <label class="mb-1.5 block text-xs font-medium text-gray-500">Search</label>
      <input type="text" placeholder="Search by name, order no, email, mobile..."
        [(ngModel)]="search"
        class="w-full rounded-lg border border-gray-300 px-3.5 py-2.5 text-sm placeholder:text-gray-400 focus:border-[#66B42A] focus:outline-none focus:ring-1 focus:ring-[#66B42A]/30" />
    </div>
    <div class="w-full lg:w-48">
      <label class="mb-1.5 block text-xs font-medium text-gray-500">Order Status</label>
      <select [(ngModel)]="orderStatus"
        class="w-full rounded-lg border border-gray-300 bg-white px-3.5 py-2.5 text-sm focus:border-[#66B42A] focus:outline-none focus:ring-1 focus:ring-[#66B42A]/30">
        <option value="">All Status</option>
        <option value="2">Pending Payment</option>
        <option value="3">Payment Received</option>
        <option value="4">Approved</option>
        <option value="5">Rejected</option>
        <option value="6">Completed</option>
        <option value="7">Cancelled</option>
      </select>
    </div>
    <div class="w-full lg:w-44">
      <app-date-picker label="From Date" placeholder="DD/MM/YYYY" [(ngModel)]="dateFrom" name="dateFrom" />
    </div>
    <div class="w-full lg:w-44">
      <app-date-picker label="To Date" placeholder="DD/MM/YYYY" [(ngModel)]="dateTo" name="dateTo" />
    </div>
    <div class="flex gap-2">
      <button (click)="onSearch()"
        class="inline-flex items-center gap-1.5 rounded-lg bg-[#66B42A] px-5 py-2.5 text-sm font-medium text-white hover:bg-[#4E9C1F]">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        Search
      </button>
      <button (click)="onClear()"
        class="rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-sm font-medium text-gray-600 hover:bg-gray-50">
        Clear
      </button>
    </div>
  </div>

  <button (click)="showAdvanced = !showAdvanced"
    class="mt-4 inline-flex items-center gap-1.5 text-xs font-medium text-[#66B42A] hover:text-[#4E9C1F]">
    <svg class="h-3.5 w-3.5 transition-transform" [class.rotate-180]="showAdvanced" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
    </svg>
    {{ showAdvanced ? 'Less Filters' : 'More Filters' }}
    @if (hasActiveFilters()) {
      <span class="ml-1 inline-flex h-4 w-4 items-center justify-center rounded-full bg-[#66B42A] text-[10px] text-white">!</span>
    }
  </button>

  @if (showAdvanced) {
    <div class="mt-5 grid grid-cols-1 gap-4 border-t border-gray-100 pt-5 sm:grid-cols-2 lg:grid-cols-4">
      <div>
        <label class="mb-1.5 block text-xs font-medium text-gray-500">Order Type</label>
        <select [(ngModel)]="orderType"
          class="w-full rounded-lg border border-gray-300 bg-white px-3.5 py-2.5 text-sm focus:border-[#66B42A] focus:outline-none focus:ring-1 focus:ring-[#66B42A]/30">
          <option value="">All</option>
          <option value="1">EPIN</option>
          <option value="2">Product</option>
          <option value="3">Package</option>
          <option value="4">Upgrade</option>
          <option value="5">Service</option>
        </select>
      </div>
      <div>
        <label class="mb-1.5 block text-xs font-medium text-gray-500">Payment Status</label>
        <select [(ngModel)]="paymentStatus"
          class="w-full rounded-lg border border-gray-300 bg-white px-3.5 py-2.5 text-sm focus:border-[#66B42A] focus:outline-none focus:ring-1 focus:ring-[#66B42A]/30">
          <option value="">All</option>
          <option value="1">Pending</option>
          <option value="2">Verified</option>
          <option value="3">Failed</option>
          <option value="4">Rejected</option>
          <option value="5">Cancelled</option>
          <option value="6">Refunded</option>
        </select>
      </div>
      <div>
        <label class="mb-1.5 block text-xs font-medium text-gray-500">Login ID</label>
        <input type="text" placeholder="Login ID" [(ngModel)]="loginId"
          class="w-full rounded-lg border border-gray-300 px-3.5 py-2.5 text-sm placeholder:text-gray-400 focus:border-[#66B42A] focus:outline-none focus:ring-1 focus:ring-[#66B42A]/30" />
      </div>
      <div>
        <label class="mb-1.5 block text-xs font-medium text-gray-500">Sort By</label>
        <select [(ngModel)]="sortBy"
          class="w-full rounded-lg border border-gray-300 bg-white px-3.5 py-2.5 text-sm focus:border-[#66B42A] focus:outline-none focus:ring-1 focus:ring-[#66B42A]/30">
          <option value="CreatedDate">Newest First</option>
          <option value="OrderNo">Order No</option>
          <option value="MemberName">Member Name</option>
          <option value="Amount">Amount</option>
          <option value="PaymentStatus">Payment Status</option>
          <option value="OrderStatus">Order Status</option>
        </select>
      </div>
      <div>
        <label class="mb-1.5 block text-xs font-medium text-gray-500">Direction</label>
        <select [(ngModel)]="sortDirection"
          class="w-full rounded-lg border border-gray-300 bg-white px-3.5 py-2.5 text-sm focus:border-[#66B42A] focus:outline-none focus:ring-1 focus:ring-[#66B42A]/30">
          <option value="Desc">Newest First</option>
          <option value="Asc">Oldest First</option>
        </select>
      </div>
    </div>
  }
</div>
