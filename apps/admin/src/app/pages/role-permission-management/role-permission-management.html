<div class="role-permission">
  <h1 class="role-permission__title">Roles &amp; Permissions</h1>

  <div class="role-permission__grid">
    @for (group of groups; track group.role) {
      <app-card [title]="group.label" subtitle="Permissions granted to this role">
        <form [formGroup]="group.form" class="role-permission__checklist">
          @for (permission of permissions; track permission) {
            <app-checkbox-field [label]="permissionLabel(permission)" [control]="group.form.controls[permission]" />
          }
        </form>
      </app-card>
    }
  </div>
</div>
